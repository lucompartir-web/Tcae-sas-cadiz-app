name: Android CI Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Conceder permisos de ejecución a gradlew
        run: chmod +x Aplicaciones/gradlew # Damos permiso al archivo en la subcarpeta
        
      - name: Compilar (Build) con Gradle para crear la APK de Release
        run: ./gradlew assembleRelease
        working-directory: Aplicaciones # <--- ¡SOLUCIÓN DE LA RUTA!

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-release
          path: Aplicaciones/app/build/outputs/apk/release/app-release-unsigned.apk
