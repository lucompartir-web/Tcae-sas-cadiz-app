name: Android CI Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Conceder permisos de ejecución a gradlew
        # >> Aquí se concede permiso a gradlew ANTES de cambiar de carpeta (si está en la raíz)
        run: chmod +x gradlew 

      - name: Cambiar a la carpeta del proyecto Android
        # >> Reemplaza 'Aplicaciones' por el nombre EXACTO de la carpeta que contiene tus archivos.
        run: cd Aplicaciones 
        
      - name: Compilar (Build) con Gradle para crear la APK de Release
        # >> La compilación se ejecuta DENTRO de la carpeta 'Aplicaciones'
        run: ./gradlew assembleRelease

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-release
          # >> Asegúrate de que esta ruta se ajusta al nuevo directorio de compilación
          path: Aplicaciones/app/build/outputs/apk/release/app-release-unsigned.apk


